about:
  content: >
    # Sobre My App

    My App es una versión modificada de IT-Tools, desarrollado originalmente por Corentin Thomasset. El [código fuente modificado](https://github.com/zero-ljz/it-tools) permanece publicado bajo la licencia GPL-3.0.

    ## Tecnologías

    My App está creado en Vue.js (Vue 3) con la biblioteca de componentes Naive UI. En algunas herramientas se utilizan bibliotecas de código abierto de terceros; puede encontrar la lista completa en [package.json](https://github.com/zero-ljz/it-tools/blob/main/package.json) archivo del repositorio.

    ## ¿Encontraste un error? ¿Falta una herramienta?

    Si necesita una herramienta que actualmente no está presente aquí y cree que puede ser útil, puede enviar una solicitud de función en el [issues section](https://github.com/zero-ljz/it-tools/issues/new/choose) en el repositorio de GitHub.

    Y si encontró un error o algo no funciona como se esperaba, presente un reporte de error en el [issues section](https://github.com/zero-ljz/it-tools/issues/new/choose) en el repositorio de GitHub.

