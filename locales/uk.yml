about:
  content: >
    # Про IT-Tools

    Цей вебсайт є модифікованою версією IT-Tools, спочатку розробленою Corentin Thomasset. [Модифікований вихідний код](https://github.com/zero-ljz/it-tools) надалі публікується за ліцензією GPL-3.0.

    ## Технології

    IT Tools виконаний на Vue.js (Vue 3) з використанням бібліотеки компонентів Naive UI. У деяких інструментах використовуються сторонні відкриті бібліотеки, повний список яких ви можете знайти в файлі [package.json](https://github.com/zero-ljz/it-tools/blob/main/package.json) репозиторію.

    ## Знайшли баг? Відсутній інструмент?

    Якщо вам потрібен інструмент, якого наразі немає тут, і ви вважаєте, що він може бути корисним, ви можете подати запит на додавання функції в [розділі проблем](https://github.com/zero-ljz/it-tools/issues/new/choose) у репозиторії GitHub.

    А якщо ви знайшли баг або щось не працює, як очікувалося, будь ласка, подайте звіт про баг в [розділі проблем](https://github.com/zero-ljz/it-tools/issues/new/choose) у репозиторії GitHub.

